[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "busanlink-backend"
version = "0.1.0"
description = "BusanLink FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "asyncpg>=0.30.0,<1.0.0",
  "fastapi>=0.121.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pyjwt[crypto]>=2.10.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10.0.0",
  "pytest-asyncio>=0.25.0,<2.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: requires explicitly configured external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
